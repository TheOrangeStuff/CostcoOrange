# Equivalent of the Unraid container settings in README.md.
services:
  costcoorange:
    image: ghcr.io/theorangestuff/costcoorange-backend:latest
    container_name: costcoorange
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/costcoorange:/data
    environment:
      TZ: America/Chicago
    ports:
      - "7057:7057"
    # On the same Docker network as Nginx Proxy Manager, NPM can reach it by name.
    networks: [proxynet]

networks:
  proxynet:
    external: true
