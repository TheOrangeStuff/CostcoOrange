# Every push to main that touches backend/ runs the tests, then publishes the Docker image to
# ghcr.io/theorangestuff/costcoorange-backend (:latest and :<short sha>). Unraid pulls :latest.
name: Backend image

on:
  push:
    branches: [main]
    paths: ["backend/**", "unraid/**", ".github/workflows/backend-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Test
        working-directory: backend
        run: uv run pytest -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Build once, prove the container starts and can write its database as Unraid's
      # nobody:users, then push the same (cached) build.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: costcoorange:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/data" && sudo chown root:root "$RUNNER_TEMP/data"
          docker run -d --name smoke -p 7057:7057 -v "$RUNNER_TEMP/data:/data" costcoorange:test
          for i in $(seq 30); do curl -fs localhost:7057/api/health && break; sleep 1; done
          curl -fs localhost:7057/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:7057/api/summary)" = 401
          echo 'smoketest1' | docker exec -i -u 99:100 smoke python -c "from app import auth, db; db.init(); auth.create_user('ci', 'smoketest1')"
          curl -fs -XPOST localhost:7057/api/auth/login -H 'content-type: application/json' \
            -d '{"username":"ci","password":"smoketest1"}' | grep -q token
          stat -c '%u:%g' "$RUNNER_TEMP/data/costco.db" | grep -qx 99:100
          docker logs smoke

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/theorangestuff/costcoorange-backend:latest
            ghcr.io/theorangestuff/costcoorange-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
