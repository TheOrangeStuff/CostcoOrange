# Every push to main that touches backend/ runs the tests, then publishes the Docker image to
# ghcr.io/theorangestuff/costcoorange-backend (:latest and :<short sha>). Unraid pulls :latest.
name: Backend image

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Test
        working-directory: backend
        run: uv run pytest -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/theorangestuff/costcoorange-backend:latest
            ghcr.io/theorangestuff/costcoorange-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
