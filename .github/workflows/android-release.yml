# Every push to main that touches android/ builds a signed APK and publishes it as a GitHub Release
# on this (private) repo. Obtainium reads it with a GitHub token. Each release is one minor
# version up from the last (v0.2.0, v0.3.0, ...).
#
# Secrets: COSTCO_KEYSTORE_BASE64, COSTCO_KEYSTORE_PASSWORD, COSTCO_KEY_ALIAS, COSTCO_KEY_PASSWORD.
name: Android release

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two quick pushes don't both claim the same version.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Pick the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo v0.1.0)
          IFS=. read -r major minor _ <<< "${last#v}"
          echo "VERSION=$major.$((minor + 1)).0" >> "$GITHUB_ENV"

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.COSTCO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The run number is the versionCode, so every APK installs over the one before.
      - name: Build
        env:
          COSTCO_KEYSTORE: ${{ runner.temp }}/release.jks
          COSTCO_KEYSTORE_PASSWORD: ${{ secrets.COSTCO_KEYSTORE_PASSWORD }}
          COSTCO_KEY_ALIAS: ${{ secrets.COSTCO_KEY_ALIAS }}
          COSTCO_KEY_PASSWORD: ${{ secrets.COSTCO_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName="$VERSION" \
            -PversionCode="${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "costcoorange-v$VERSION.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "costcoorange-v$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --notes "Built from ${GITHUB_SHA::7}."
